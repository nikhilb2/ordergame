apiVersion: apps/v1
kind: Deployment
metadata:
  name: mathgame
  namespace: nikhil
  labels:
    app: mathgame
spec:
  replicas: 1
  # The log volume can only be mounted by one pod at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mathgame
  template:
    metadata:
      labels:
        app: mathgame
    spec:
      imagePullSecrets:
      - name: docker-registry-auth
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mathgame-data
      containers:
        - name: api
          image: registry.kube.nikhilbhatia.com/ordergame:v8
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: hire-me-online-telegram
                optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
